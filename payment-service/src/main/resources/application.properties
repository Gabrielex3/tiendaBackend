spring.application.name=payment-service
server.port=${SERVER_PORT.PAGOS:8083}
spring.config.import=optional:file:/home/gabrielexe/Documentos/tiendaBackend/.env[.properties]

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:${SERVER_PORT.EUREKA:8761}/eureka/

# DB
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME.PAGOS:tienda_pagos}
spring.datasource.username=${DB_USERNAME:tienda_app}
spring.datasource.password=${DB_PASSWORD:tienda123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator
management.endpoints.web.exposure.include=health,info
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
