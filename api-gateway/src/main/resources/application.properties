spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/sneakerx/pago/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[6].filters[1]=PrefixPath=/api

