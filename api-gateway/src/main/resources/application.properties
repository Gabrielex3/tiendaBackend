spring.application.name=api-gateway
server.port=${SERVER_PORT.GATEWAY:8082}
spring.config.import=optional:file:/home/gabrielexe/Documentos/tiendaBackend/.env[.properties]

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:${SERVER_PORT.EUREKA:8761}/eureka/

# Spring Cloud Gateway - Rutas con prefijo /api/v1/sneakerx/
# Spring Boot 4.1 + Spring Cloud 2025.1 usa spring.cloud.gateway.server.webflux.routes
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# ========================================
# USUARIOS SERVICE - /api/v1/sneakerx/user/**
# ========================================

# Auth endpoints (login, register)
# /api/v1/sneakerx/user/auth/** -> StripPrefix=4 -> /auth/** -> PrefixPath=/api -> /api/auth/**
spring.cloud.gateway.server.webflux.routes[0].id=usuarios-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/sneakerx/user/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[0].filters[1]=PrefixPath=/api

# User profile endpoint
# /api/v1/sneakerx/user/usuarios/** -> StripPrefix=4 -> /usuarios/** -> PrefixPath=/api -> /api/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].id=usuarios-perfil
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/sneakerx/user/usuarios/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[1].filters[1]=PrefixPath=/api

# Admin users endpoint
# /api/v1/sneakerx/user/admin/usuarios/** -> StripPrefix=4 -> /admin/usuarios/** -> PrefixPath=/api -> /api/admin/usuarios/**
spring.cloud.gateway.server.webflux.routes[2].id=usuarios-admin
spring.cloud.gateway.server.webflux.routes[2].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/sneakerx/user/admin/usuarios/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[2].filters[1]=PrefixPath=/api

# ========================================
# PRODUCT SERVICE - /api/v1/sneakerx/producto/**
# ========================================

# Productos públicos
# /api/v1/sneakerx/producto/productos/** -> StripPrefix=4 -> /productos/** -> PrefixPath=/api -> /api/productos/**
spring.cloud.gateway.server.webflux.routes[3].id=product-productos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/sneakerx/producto/productos/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[3].filters[1]=PrefixPath=/api

# Admin productos
# /api/v1/sneakerx/producto/admin/productos/** -> StripPrefix=4 -> /admin/productos/** -> PrefixPath=/api -> /api/admin/productos/**
spring.cloud.gateway.server.webflux.routes[4].id=product-admin
spring.cloud.gateway.server.webflux.routes[4].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/sneakerx/producto/admin/productos/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=4
spring.cloud.gateway.server.webflux.routes[4].filters[1]=PrefixPath=/api

# ========================================
# CARRITO - /api/v1/sneakerx/carrito/**
# ========================================

# Carrito del usuario
# /api/v1/sneakerx/carrito/** -> StripPrefix=3 -> /carrito/** -> PrefixPath=/api -> /api/carrito/**
spring.cloud.gateway.server.webflux.routes[5].id=product-carrito
spring.cloud.gateway.server.webflux.routes[5].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/sneakerx/carrito/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=3
spring.cloud.gateway.server.webflux.routes[5].filters[1]=PrefixPath=/api

# ========================================
# CORS (para frontend en localhost:5173)
# ========================================
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5500,http://127.0.0.1:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Actuator
management.endpoints.web.exposure.include=health,info,gateway

# Disable default security (auth handled by user-service)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration

