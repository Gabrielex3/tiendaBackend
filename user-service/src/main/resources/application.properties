spring.application.name=usuarios-service
server.port=${SERVER_PORT.USUARIOS:8080}
spring.config.import=optional:file:/home/gabrielexe/Documentos/tiendaBackend/.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME.USUARIOS}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway administra el esquema; Hibernate solo lo valida.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# El resumen de conexiones de Hibernate puede incluir credenciales del driver.
logging.level.org.hibernate.orm.connections.pooling=WARN
spring.sql.init.mode=never

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:${SERVER_PORT.EUREKA:8761}/eureka/
eureka.instance.prefer-ip-address=false
